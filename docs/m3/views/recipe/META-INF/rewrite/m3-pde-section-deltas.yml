---
type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.openrewrite.platformviews.PdeSectionDeltas
displayName: PDE form sections answer model events with deltas (pde-model adapter)
description: >-
  Each listed form section's modelChanged replaces its viewer.refresh() with M3ModelChangedDeltas.refresh(viewer,
  event, row mapper): one delta (removals, insertions at the refreshed positions, label updates of the changed rows)
  instead of a rebuild of the section's table. A setInput of the same input before it is skipped. WORLD_CHANGED keeps
  the stock refresh. Sites from docs/m3/correction-sites FINAL_PASS_MODEL_LISTENER.tsv (DELTA_DEFECT, pde-model).
recipeList:
  - com.synexia.openrewrite.platformviews.M3ReplaceStatement:
      declaringClasses: [org.eclipse.pde.internal.ui.editor.plugin.LibrarySection]
      methodName: modelChanged
      statement: "fLibraryTable.refresh();"
      replacement: "org.eclipse.pde.internal.ui.editor.m3.M3ModelChangedDeltas.refresh(fLibraryTable, event, o -> o);"
  - com.synexia.openrewrite.platformviews.M3ReplaceStatement:
      declaringClasses: [org.eclipse.pde.internal.ui.editor.plugin.ExecutionEnvironmentSection]
      methodName: modelChanged
      statement: "fEETable.refresh();"
      replacement: "org.eclipse.pde.internal.ui.editor.m3.M3ModelChangedDeltas.refresh(fEETable, e, o -> o);"
